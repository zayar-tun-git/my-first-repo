<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor AI Chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e4570e'/%3E%3Cpath d='M8 12h16M8 18h10' stroke='%23fff8f3' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span>
          <strong>Cursor AI Chat</strong>
          <small>Coding assistant</small>
        </span>
      </div>
      <button type="button" class="primary" id="new-chat">New chat</button>
      <label class="sr-only" for="search">Search chats</label>
      <input class="search" id="search" type="search" placeholder="Search chats" autocomplete="off">
      <nav class="chat-list" id="chat-list" aria-label="Chats"></nav>
      <div class="sidebar-foot">
        <button type="button" class="ghost" id="open-settings">Settings</button>
      </div>
    </aside>
    <button type="button" class="backdrop" id="backdrop" aria-label="Close chats"></button>
    <main class="main">
      <header class="topbar">
        <button type="button" class="ghost" id="menu">Chats</button>
        <h1 id="title">New chat</h1>
        <div class="top-actions">
          <label class="sr-only" for="mode">Reply with</label>
          <select class="mode" id="mode">
            <option value="local">Local guide</option>
            <option value="api">Custom model</option>
          </select>
          <button type="button" class="ghost" id="export">Export</button>
        </div>
      </header>
      <div class="thread" id="thread"></div>
      <div class="composer-wrap">
        <form class="composer" id="composer">
          <label class="sr-only" for="input">Message</label>
          <textarea id="input" rows="1" placeholder="Ask about code, or paste a snippet"></textarea>
          <div class="composer-bar">
            <button type="button" class="stop" id="stop" hidden>Stop</button>
            <button type="submit" class="send" id="send">Send</button>
          </div>
        </form>
        <p class="hint" id="hint"></p>
      </div>
    </main>
  </div>

  <dialog id="settings" aria-labelledby="settings-title">
    <form class="settings-form" id="settings-form" novalidate>
      <h2 id="settings-title">Settings</h2>
      <p class="lede">The local guide answers in the page. A custom model calls an OpenAI-compatible chat endpoint.</p>
      <div class="modes">
        <label><input type="radio" name="mode" value="local" checked> Local guide</label>
        <label><input type="radio" name="mode" value="api"> Custom model</label>
      </div>
      <label class="field">Base URL
        <input name="baseUrl" type="url" spellcheck="false" autocomplete="off" required>
      </label>
      <label class="field">Model
        <input name="model" type="text" spellcheck="false" autocomplete="off">
      </label>
      <label class="field">API key
        <input name="apiKey" type="password" autocomplete="off">
      </label>
      <p class="fine">The key is saved in local storage on this device and is sent only to the base URL you enter.</p>
      <p class="settings-error" id="settings-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="ghost" id="settings-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden>
    <span></span>
    <button type="button" class="ghost" id="undo">Undo</button>
  </div>
  <p class="sr-only" id="status" role="status"></p>
  <script type="module" src="js/app.js"></script>
</body>
</html>
